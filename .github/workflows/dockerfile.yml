---
name: dockerfile

# Builds the image and checks that it serves the site. On main it also pushes
# ghcr.io/lootregenit/lootregen-site:<first 12 characters of the commit>.
# The deploy is azure-pipelines.yml: Azure Pipelines (agent on K3s) waits for that tag
# and commits it to the homelab repo; Flux rolls it out.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lootregenit/lootregen-site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: build
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t site:ci .

      - name: smoke test
        run: |
          # Same restrictions as in the cluster: uid 101, read-only root filesystem
          docker run -d --name site -p 8080:8080 --read-only --tmpfs /tmp --user 101 site:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$1")
            echo "$1 -> $code (want $2)"
            [ "$code" = "$2" ]
          }
          fail=0
          for p in / '/?lang=de' '/?lang=pl' /homelab /cv /blog /posts/homelab-part-1 \
                   /favicon.png /robots.txt /sitemap.xml /docs/basislehrjahr-zertifikat.pdf; do
            check "$p" 200 || fail=1
          done
          check /does-not-exist 404 || fail=1
          check /.thumbnail 404 || fail=1   # design export leftovers never ship
          curl -s http://localhost:8080/does-not-exist | grep -qi '<html' || { echo "custom 404 page missing"; fail=1; }
          docker logs site | tail -n 20
          exit "$fail"

      # Only an image that passed the smoke test gets a tag. The package must allow this
      # repo to write: ghcr package settings -> Manage Actions access -> Webpage-lootregen, Write.
      - name: push (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAG="${GITHUB_SHA::12}"
          docker tag site:ci "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          echo "Pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
