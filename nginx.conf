server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Requests arrive through cloudflared on port 8080. Relative redirects keep
    # nginx from sending visitors to http://<host>:8080/... behind the tunnel.
    absolute_redirect off;

    # Cloudflare terminates TLS; trust its forwarded headers only for logging
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 10.42.0.0/16;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Clean URLs: /blog serves blog.html, /posts/n100-nas serves posts/n100-nas.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 7d;
        # add_header in a location replaces the server-level ones, so repeat them
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
